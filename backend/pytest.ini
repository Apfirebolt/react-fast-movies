[tool:pytest]
# Pytest configuration for Fast React Movies Backend

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts = 
    -v
    --strict-markers
    --tb=short
    --durations=10
    --disable-warnings
    --no-cov-on-fail

# Markers
markers = 
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    movies: Movie-related tests
    playlists: Playlist-related tests
    kafka: Kafka integration tests
    database: Database tests
    api: API endpoint tests
    slow: Tests that take longer to run
    external: Tests that require external services
    smoke: Quick smoke tests
    regression: Regression tests

# Async testing
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = backend
omit = 
    backend/tests/*
    backend/__pycache__/*
    backend/*/__pycache__/*
    backend/*/migrations/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2

[coverage:html]
directory = htmlcov